[project]
name = "pullsense-server"
version = "0.1.0"
description = "PullSense AI-powered PR Review Platform — Backend API"
readme = "README.md"
authors = [
    { name = "Nadil-Dulnidu", email = "nzinlud963@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",

    # Redis
    "redis[hiredis]>=6.0.0",

    # Task queue
    "celery[redis]>=5.5.0",

    # Configuration
    "pydantic-settings>=2.8.0",

    # Authentication
    "pyjwt[crypto]>=2.10.0",
    "httpx>=0.28.0",

    # Logging
    "structlog>=25.1.0",

    # Google Cloud / Vertex AI / Agent Development Kit (ADK)
    "google-genai>=1.0.0",
    "google-auth>=2.30.0",

    # Vector Database
    "pinecone>=5.0.0",

    # Utilities
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
]


[project.scripts]
server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "S",     # flake8-bandit
    "T20",   # flake8-print
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = ["S101", "S104", "B008", "RUF012", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["server"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
