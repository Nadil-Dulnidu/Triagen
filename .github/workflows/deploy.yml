name: Continuous Deployment (Cloud Run)

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "client/**"
      - "infrastructure/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  GAR_REPOSITORY: ${{ vars.GCP_GAR_REPOSITORY }}

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 1. Build & Push Server Containers (FastAPI API & Celery Worker)
      - name: Build and Push Backend Images
        run: |
          API_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/triagen-api:${{ github.sha }}"
          API_LATEST="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/triagen-api:latest"
          
          WORKER_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/triagen-worker:${{ github.sha }}"
          WORKER_LATEST="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/triagen-worker:latest"
          
          docker build -t $API_IMAGE -t $API_LATEST ./server
          docker push $API_IMAGE
          docker push $API_LATEST
          
          docker build -f ./server/Dockerfile.worker -t $WORKER_IMAGE -t $WORKER_LATEST ./server
          docker push $WORKER_IMAGE
          docker push $WORKER_LATEST

      # 2. Build & Push Frontend Container (Next.js 15)
      - name: Build and Push Frontend Image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/triagen-client:${{ github.sha }}"
          LATEST_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/triagen-client:latest"
          
          docker build \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            -t $IMAGE_URI -t $LATEST_URI ./client
          docker push $IMAGE_URI
          docker push $LATEST_URI

      # 3. Deploy FastAPI Backend API to Cloud Run
      - name: Deploy FastAPI Backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: triagen-prod-api
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/triagen-api:${{ github.sha }}

      # 4. Deploy Celery Review Worker to Cloud Run
      - name: Deploy Celery Worker to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: triagen-prod-worker
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/triagen-worker:${{ github.sha }}

      # 5. Deploy Next.js Frontend Client to Cloud Run
      - name: Deploy Next.js Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: triagen-prod-client
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/triagen-client:${{ github.sha }}
