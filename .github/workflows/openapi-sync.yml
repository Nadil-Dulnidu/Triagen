name: OpenAPI Contract Sync Check

on:
  pull_request:
    paths:
      - "server/src/server/domains/**"
      - "server/src/server/main.py"
      - "client/lib/api.ts"

jobs:
  check-contracts:
    name: Verify OpenAPI Schema Alignment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv and backend dependencies
        run: |
          curl -LsSf https://astral.sh/uv/0.6.3/install.sh | sh
          cd server && uv sync

      - name: Generate OpenAPI JSON Spec
        run: |
          cd server && uv run python -c "
          import json
          from server.main import app
          from fastapi.openapi.utils import get_openapi
          schema = get_openapi(
              title=app.title,
              version=app.version,
              openapi_version=app.openapi_version,
              description=app.description,
              routes=app.routes,
          )
          with open('openapi.json', 'w') as f:
              json.dump(schema, f, indent=2)
          print('Successfully exported openapi.json')
          "

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "client/package-lock.json"

      - name: Verify Frontend Build with Contracts
        run: |
          cd client
          npm ci
          npm run lint
          npm run build
